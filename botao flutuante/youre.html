<meta charset="UTF-8">

<title>O Botão Flutuante</title>

<body>
<button id="btn">Clique aqui</button>
<button id="btn1">Clique aqui</button>
<footer>Um projeto inútil. O botão às vezes bate no canto.</footer>

<script>
  const btn = document.getElementById('btn');
  let x = Math.random() * 200, y = Math.random() * 200;
  let vx = 3, vy = 2.5; // pixels por quadro (~60fps)
  let last = performance.now();

  function frame(now) {
    const dt = Math.min((now - last) / 16.667, 3); // normaliza pelo tempo
    last = now;
    const maxX = window.innerWidth - btn.offsetWidth;
    const maxY = window.innerHeight - btn.offsetHeight;

    x += vx * dt;
    y += vy * dt;

    if (x <= 0)     { x = 0;    vx =  Math.abs(vx); }
    if (x >= maxX)  { x = maxX; vx = -Math.abs(vx); }
    if (y <= 0)     { y = 0;    vy =  Math.abs(vy); }
    if (y >= maxY)  { y = maxY; vy = -Math.abs(vy); }

    btn.style.transform = `translate(${x}px, ${y}px)`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  btn.addEventListener('click', () => { window.location.href = 'imagem.html'; });
</script>
</body>
</html>
